name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

# Don't cancel an in-flight deploy; queue the next one behind it.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check-config:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Verify deploy configuration
        id: check
        env:
          API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          MISSING=""
          [ -z "$API_TOKEN" ]  && MISSING="$MISSING CLOUDFLARE_API_TOKEN(secret)"
          [ -z "$ACCOUNT_ID" ] && MISSING="$MISSING CLOUDFLARE_ACCOUNT_ID(secret)"
          [ -z "$SITE_URL" ]   && MISSING="$MISSING SITE_URL(variable)"
          if [ -n "$MISSING" ]; then
            echo "::warning title=Deploy skipped::Missing configuration:$MISSING. See .github/DEPLOY.md for one-time setup."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: check-config
    if: needs.check-config.outputs.ready == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify source before deployment
        run: |
          npm run lint
          npm run typecheck
          npm test

      - name: Build static export
        run: npm run build

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy worker/index.js

      - name: Smoke check live site
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          STATUS=$(curl -sL -o /dev/null -w "%{http_code}" "$SITE_URL/")
          if [ "$STATUS" != "200" ]; then
            echo "::error::Live site returned HTTP $STATUS after deploy"
            exit 1
          fi
          echo "::notice::Live site healthy (HTTP $STATUS)"
